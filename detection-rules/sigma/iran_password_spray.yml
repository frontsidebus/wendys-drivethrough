# FILE: sigma/iran_password_spray.yml
---
title: Peach Sandstorm APT33 Password Spray Against Azure AD and M365
id: 2a4b6c8d-0e1f-3a5b-7c9d-1e3f5a7b9c0d
status: experimental
description: |
    Detects password spray attack patterns consistent with Peach Sandstorm (APT33/Elfin/Refined
    Kitten) campaigns targeting Azure Active Directory and Microsoft 365 environments. Peach
    Sandstorm conducts large-scale password spray operations against organizations in defense,
    satellite, pharmaceutical, and energy sectors, attempting a small number of commonly used
    passwords against many accounts to avoid per-account lockout thresholds. This rule identifies
    high volumes of failed authentication attempts distributed across many accounts from limited
    source IPs, IMAP/POP legacy auth abuse, and patterns of single-password-many-accounts spraying
    observed in Microsoft Entra ID (Azure AD) sign-in logs.
references:
    - https://www.microsoft.com/en-us/security/blog/2023/09/14/peach-sandstorm-password-spray-campaigns-enable-intelligence-collection-at-high-value-targets/
    - https://attack.mitre.org/groups/G0064/
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-241a
    - https://unit42.paloaltonetworks.com/apt33-insights/
author: Wendy's Drive-Through Detection Engineering
date: 2026-02-28
tags:
    - attack.credential_access
    - attack.t1110.003
    - attack.initial_access
    - attack.t1078.004
    - attack.t1110.001
    - detection.emerging_threats
logsource:
    product: azure
    service: signinlogs
detection:
    selection_failed_auth:
        Status.errorCode:
            - 50126
            - 50053
            - 50055
            - 50056
            - 53003
        ResultType:
            - '50126'
            - '50053'
            - '50055'
            - '50056'
            - '53003'
    selection_legacy_auth:
        ClientAppUsed:
            - 'Exchange ActiveSync'
            - 'IMAP4'
            - 'POP3'
            - 'SMTP'
            - 'Other clients'
            - 'Authenticated SMTP'
            - 'Exchange Online PowerShell'
    selection_non_interactive:
        IsInteractive: 'false'
    selection_suspicious_ua:
        UserAgent|contains:
            - 'python-requests'
            - 'axios'
            - 'Go-http-client'
            - 'curl'
            - 'okhttp'
            - 'Java'
            - 'libwww-perl'
            - 'Wget'
            - 'httpx'
            - 'aiohttp'
            - 'node-fetch'
    selection_tor_vpn_infra:
        IPAddress|startswith:
            - '185.220.'
            - '104.244.'
            - '198.98.'
            - '23.129.'
            - '45.153.'
            - '91.243.'
    condition: selection_failed_auth and (selection_legacy_auth or selection_non_interactive or selection_suspicious_ua or selection_tor_vpn_infra)
falsepositives:
    - Large organizations with many users experiencing legitimate password failures
    - Automated service accounts with expired credentials across many systems
    - Migration scenarios where many accounts authenticate simultaneously
    - Security testing and authorized penetration testing engagements
    - Legacy applications using older authentication protocols legitimately
level: high
